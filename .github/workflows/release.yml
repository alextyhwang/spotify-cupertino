name: Release

# Push a tag like v1.0.0 (matching VERSION in install.sh) to publish a release with
# install.sh and spotify-cupertino.zip attached, then smoke-test the one-line install.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches tag
        run: |
          v="$(sed -n 's/^VERSION="\(.*\)"/\1/p' install.sh)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "install.sh VERSION $v does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build zip
        run: |
          mkdir -p dist/spotify-cupertino
          cp -R install.sh theme extensions README.md LICENSE dist/spotify-cupertino/
          (cd dist && zip -qr spotify-cupertino.zip spotify-cupertino)
          cp install.sh dist/install.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/install.sh dist/spotify-cupertino.zip \
            --title "Spotify Cupertino ${GITHUB_REF_NAME}" --generate-notes --verify-tag

  smoke-test:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: One-line install from the release (fresh Mac)
        run: curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | bash -s -- --yes --no-launch
      - name: Check
        run: curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | bash -s -- --check
